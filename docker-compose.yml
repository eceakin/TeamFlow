services:
  postgres:
    image: postgres:16
    container_name: teamflow_postgres
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    ports:
      - "5432:5432"
    volumes:
      - teamflow_postgres_data:/var/lib/postgresql/data

volumes:
  teamflow_postgres_data: